<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>页面走丢了 · 404</title>
<meta name="robots" content="noindex">
<meta name="color-scheme" content="light dark">
<style>
  :root {
    color-scheme: light dark;
    --bg: #F6F4EF; --surface: #FFFFFF; --ink: #14161A; --ink-2: #50555F;
    --line: #E3DFD7; --brand: #1B4DFF; --pop-a: #FF4D2E; --pop-b: #FFD400;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0F1116; --surface: #171A21; --ink: #EDEFF4; --ink-2: #A7AEBC;
      --line: #262A33; --brand: #6C8CFF; --pop-a: #FF6A4D; --pop-b: #FFD84D;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; min-height: 100svh; display: grid; place-items: center;
    /* 全面屏：让开顶部状态栏与底部横条，横屏时让开两侧刘海 */
    padding: max(24px, env(safe-area-inset-top)) max(24px, env(safe-area-inset-right))
             max(24px, env(safe-area-inset-bottom)) max(24px, env(safe-area-inset-left));
    background: var(--bg); color: var(--ink);
    font-family: "Inter", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .box { max-width: 460px; width: 100%; }
  .num {
    font-size: clamp(5rem, 18vw, 8rem); font-weight: 800; line-height: .9;
    letter-spacing: -.06em;
    background: linear-gradient(100deg, var(--brand), var(--pop-a) 55%, var(--pop-b));
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  h1 { font-size: 1.35rem; letter-spacing: -.025em; margin: 20px 0 0; }
  p { color: var(--ink-2); line-height: 1.7; margin: 10px 0 0; }
  .acts { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 26px; }
  a {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 11px 20px; border-radius: 999px; font-size: .92rem;
    font-weight: 600; text-decoration: none; color: inherit;
    border: 1px solid var(--line); background: var(--surface);
    transition: transform .2s, border-color .2s, background-color .2s, color .2s;
  }
  a:hover { transform: translateY(-2px); border-color: var(--ink); }
  a.solid { background: var(--ink); color: var(--bg); border-color: var(--ink); }
  a.solid:hover { background: var(--brand); border-color: var(--brand); color: #fff; }

  /* 手机：两个按钮撑到 44 高，够拇指点；悬停位移在触屏上会粘住，收掉 */
  @media (max-width: 640px) {
    a { min-height: 44px; }
    .acts { gap: 12px; }
    a:hover { transform: none; }
  }
</style>
<link rel="icon" href="./assets/img/favicon.svg" type="image/svg+xml">
<link rel="icon" href="./assets/img/favicon.ico" sizes="32x32">
<link rel="apple-touch-icon" href="./assets/img/apple-touch-icon.png">
</head>
<body>
  <div class="box">
    <div class="num">404</div>
    <h1>这个页面不在了</h1>
    <p>链接可能改过，或者作品已经下线。回到主页看看现在有什么吧。</p>
    <div class="acts">
      <!-- 仓库名不是 <用户名>.github.io 时，把 href 改成 /仓库名/ -->
      <a class="solid" href="/">返回主页</a>
      <a href="javascript:history.back()">回上一页</a>
    </div>
  </div>
</body>
</html>
